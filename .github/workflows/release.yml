name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder-args: --linux
          - os: windows-latest
            builder-args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall rebuilds better-sqlite3 for the runner's own platform.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx electron-builder ${{ matrix.builder-args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "SQuirreL build ${{ github.run_number }}" \
            --generate-notes
